<style>
:root{--ink:#2D2A4A;--lav:#D9C9FF;--mint:#BFF1DC;--peach:#FFD2D0;--butter:#FFF1B8}
body{font-family:Nunito,system-ui,sans-serif;color:var(--ink);background:#F8FAFC;
background-image:radial-gradient(at 8% 5%,var(--lav) 0,transparent 38%),radial-gradient(at 92% 8%,var(--mint) 0,transparent 36%),radial-gradient(at 85% 90%,var(--peach) 0,transparent 38%),radial-gradient(at 8% 92%,var(--butter) 0,transparent 36%);background-attachment:fixed}
.pc{background:#fff;border:3px solid var(--ink);border-radius:1.5rem;box-shadow:0 6px 0 var(--ink)}
.bt{border:3px solid var(--ink);border-radius:1rem;box-shadow:0 4px 0 var(--ink);padding:.35rem .9rem;font-weight:800;background:var(--butter);transition:all .15s;cursor:pointer}
.bt:hover{transform:translateY(-4px);box-shadow:0 8px 0 var(--ink)}.bt:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.bt.on{background:var(--lav)}.bt:disabled{opacity:.5}
.tag{border:2px solid var(--ink);border-radius:999px;padding:0 .6rem;font-size:.75rem;font-weight:800}
.opt{display:block;width:100%;text-align:left;border:3px solid var(--ink);border-radius:1rem;padding:.55rem .9rem;margin:.35rem 0;background:#fff;font-weight:700;transition:all .15s}
.opt:hover:not(:disabled){transform:translateY(-3px);background:var(--butter)}
.opt.ok{background:#9BEFC8;animation:pop .4s}.opt.bad{background:#FFAFB0;animation:shake .4s}.opt.sel{background:var(--lav)}
.stage{background:linear-gradient(160deg,#2D2A4A,#4B3F8F);border-radius:1.2rem;border:3px solid var(--ink);position:relative;overflow:hidden}
.stage canvas{width:100%;display:block;touch-action:none;cursor:grab}
.stage button{position:absolute;right:.5rem;top:.5rem;font-size:.75rem}
.mm .br{border:3px solid var(--ink);border-radius:1rem;padding:.6rem;font-size:.85rem}.mm li{margin:.2rem 0 0 1rem;list-style:disc}
.root{display:inline-block;border:3px solid var(--ink);border-radius:999px;padding:.3rem 1rem;font-weight:900;background:var(--butter)}
textarea,input,select{border:3px solid var(--ink);border-radius:.9rem;padding:.35rem .7rem;background:#fff;font-weight:700;max-width:100%}
.blink{transform-box:fill-box;transform-origin:center;animation:blink 4s infinite}
.wave{transform-box:fill-box;transform-origin:10% 20%;animation:wave 1.2s ease-in-out infinite}
.float{animation:float 3s ease-in-out infinite}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes wave{0%,100%{transform:rotate(0)}50%{transform:rotate(-28deg)}}
@keyframes float{50%{transform:translateY(-8px)}}
@keyframes pop{50%{transform:scale(1.04)}}@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.wv{display:none;gap:3px;align-items:center;height:22px}.wv.on{display:inline-flex}
.wv i{display:inline-block;width:4px;height:18px;background:#2D2A4A;border-radius:4px;animation:bar .8s ease-in-out infinite}
.wv i:nth-child(2){animation-delay:.15s}.wv i:nth-child(3){animation-delay:.3s}.wv i:nth-child(4){animation-delay:.45s}.wv i:nth-child(5){animation-delay:.6s}
@keyframes bar{50%{transform:scaleY(.25)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>

function loginGoogle(){
  if(!auth)return toast('Đang tải dịch vụ Google, vui lòng thử lại sau vài giây!');
  const p=new firebase.auth.GoogleAuthProvider();
  auth.signInWithPopup(p).then(()=>{

  }).catch(e=>{
    if(e.code==='auth/unauthorized-domain'){
      toast('⚠️ Cần thêm tên miền anhtu20347.github.io vào mục Authorized domains trên Firebase!');
    }else{
      toast('Lỗi đăng nhập: '+e.message);
    }
  });
}
function logoutGoogle(){if(auth)auth.signOut().then(()=>{currentUser=null;renderAuth();toast('Đã đăng xuất tài khoản Google')})}
function renderAuth(){
  const el=$('#authArea');if(!el)return;
  if(currentUser){
    el.innerHTML=`<div class="flex items-center gap-2 bg-[#BFF1DC] px-3 py-1 rounded-full border-2 border-[#2D2A4A] text-xs font-black">${currentUser.photoURL?`<img src="${currentUser.photoURL}" class="w-6 h-6 rounded-full border border-[#2D2A4A]">`:'<span>🟢</span>'}<span>${esc(currentUser.displayName||currentUser.email)}</span><button class="underline text-red-600 ml-1" onclick="logoutGoogle()">Thoát</button></div>`;
  }else{
    el.innerHTML=`<button class="bt text-sm bg-white" onclick="loginGoogle()">🔐 Đăng nhập Google</button>`;
  }
}

let KEY='',MODEL='gemini-3.8-flash';
const ST={view:'home',ch:1,type:'all',lv:'all',gen:[],ex:null,cfg:{scope:'all',n:5,min:15},ui:{},tch:1,tlv:'Vận dụng',cnt:10,pi:0,fdraft:'',ftitle:'',cd:{}};
const U=id=>ST.ui[id]||(ST.ui[id]={msgs:[],run:true});
let prog=ls.get('prog',{done:[],streak:0,last:''});
function markDone(id){const d=new Date(),f=x=>x.toDateString();if(!prog.done.includes(id))prog.done.push(id);
 if(prog.last!==f(d)){const y=new Date(d-864e5);prog.streak=prog.last===f(y)?prog.streak+1:1;prog.last=f(d)}ls.set('prog',prog)}
function saveKey(){KEY=$('#key').value.trim();MODEL=$('#model').value.trim()||'gemini-3.8-flash';ls.set('cfg',{k:KEY,m:MODEL});toast(KEY?'Đã lưu Key rồi nhé! 🦉':'Đã xoá Key – dùng dữ liệu mẫu nha 🦉')}

/* ===== Linh vật Cú Đêm ===== */
const owl=(s=120,w=true)=>`<svg viewBox="0 0 200 200" width="${s}" height="${s}" aria-label="Cú Đêm"><polygon points="52,60 44,22 82,48" fill="#9C7BEF"/><polygon points="148,60 156,22 118,48" fill="#9C7BEF"/>

<g fill="#FFB84D" stroke="#2D2A4A" stroke-width="3"><ellipse cx="80" cy="186" rx="14" ry="6"/><ellipse cx="120" cy="186" rx="14" ry="6"/></g></svg>`;

/* ===== Kết nối Gemini AI ===== */
async function ai(contents,sys){if(!KEY)throw new Error('nokey');
 if(typeof contents==='string')contents=[{role:'user',parts:[{text:contents}]}];
 const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${MODEL}:generateContent?key=${encodeURIComponent(KEY)}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({systemInstruction:{parts:[{text:sys||''}]},contents})});
 const j=await r.json();if(!r.ok)throw new Error(j.error&&j.error.message||r.status);
 return(j.candidates&&j.candidates[0].content.parts||[]).map(p=>p.text||'').join('')}
function safeJSON(t){t=String(t).replace(/```json|```/g,'').trim();const a=Math.min(...['[','{'].map(c=>t.indexOf(c)).filter(i=>i>=0)),b=Math.max(t.lastIndexOf(']'),t.lastIndexOf('}'));t=t.slice(a,b+1);
 try{return JSON.parse(t)}catch(e){return JSON.parse(t.replace(/\\(?![\\"\/bfnrtu])/g,'\\\\'))}}
const normQ=(o,i,def)=>({id:'g'+Date.now()+i,ch:+o.ch||def.ch||1,type:o.type==='essay'?'essay':'mcq',lv:o.lv||def.lv||'Vận dụng',q:o.q,opts:o.opts||[],ans:+o.ans||0,hint:o.hint||'',sol:o.sol||'',viz:o.visual3DType||o.viz||'bellcurve_3d',vp:o.vp||{},m:o.m||''});
async function genAI(def,n){const p=`Tạo ${n} bài toán Xác suất & Thống kê bằng tiếng Việt. Chương ${def.ch||'bất kỳ trong 7 chương'}, hình thức ${def.type==='essay'?'tự luận':'trắc nghiệm 4 đáp án'}, độ khó ${def.lv||'Vận dụng'}. Chỉ trả về JSON mảng, không markdown.${def.note?" Yêu cầu thêm: "+def.note+".":""} Công thức LaTeX dùng $...$ và PHẢI viết hai dấu gạch chéo ngược (\\\\frac). Mỗi phần tử: {"ch":số,"type":"mcq"|"essay","lv":"Cơ bản|Vận dụng|Vận dụng cao","q":"đề","opts":["A","B","C","D"],"ans":0-3,"hint":"gợi ý","sol":"lời giải chi tiết","visual3DType":"factory_3d|dice_3d|bellcurve_3d|medical_3d|finance_3d|queue_3d|sampling_3d|abtest_3d|dice_cards_3d","vp":{"mu":số,"sigma":số,"p":số 0-1,"label":"tóm tắt tham số"},"m":"Dạng toán;..|Dữ kiện;..|Công thức;..|Bước giải;Bẫy hay sai"}`;
 return safeJSON(await ai(p,'Bạn là Cú Đêm, trợ giảng Xác suất Thống kê.')).map((o,i)=>normQ(o,i,def))}

/* ===== Ngân hàng Dữ liệu mẫu ===== */
const CH=['Xác suất và công thức tính xác suất','Biến ngẫu nhiên','Phân phối xác suất của biến ngẫu nhiên','Mẫu ngẫu nhiên và các số đặc trưng của mẫu','Khoảng ước lượng','Kiểm định giả thuyết trong thống kê','So sánh 2 tham số'];
const M=(id,ch,type,lv,q,opts,ans,hint,sol,viz,vp,m)=>({id,ch,type,lv,q,opts,ans,hint,sol,viz,vp,m});
const BANK=[
M('s1',1,'mcq','Cơ bản','Gieo một con xúc xắc cân đối. Xác suất xuất hiện mặt có số chấm chẵn là?',['$1/6$','$1/3$','$1/2$','$2/3$'],2,'Đếm số kết quả thuận lợi trên tổng số kết quả.','Có 3 mặt chẵn (2,4,6) trong 6 mặt: $P=\\frac{3}{6}=\\frac12$.','dice_3d',{label:'Xúc xắc 6 mặt cân đối'},'Xác suất cổ điển;Chương 1|Không gian mẫu 6 mặt;Biến cố: mặt chẵn|$P(A)=\\frac{|A|}{|\\Omega|}$|Đếm 3 mặt chẵn;Chia cho 6;Bẫy: nhầm với mặt lẻ hoặc số nguyên tố'),
M('s2',1,'mcq','Vận dụng cao','Dây chuyền: máy A làm 60% sản phẩm, lỗi 2%; máy B làm 40%, lỗi 5%. Lấy ngẫu nhiên 1 sản phẩm thì thấy bị lỗi. Xác suất nó do máy B làm là?',['$0{,}25$','$0{,}5$','$0{,}625$','$0{,}75$'],2,'Dùng công thức xác suất đầy đủ rồi Bayes.','$P(L)=0{,}6\\cdot0{,}02+0{,}4\\cdot0{,}05=0{,}032$. $P(B|L)=\\frac{0{,}02}{0{,}032}=0{,}625$.','factory_3d',{p:0.032,label:'Lỗi tổng hợp 3,2%'},'Bayes;Chương 1 – dây chuyền sản xuất|$P(A)=0,6;P(B)=0,4;Lỗi A 2%, lỗi B 5%|$P(B|L)=\\frac{P(B)P(L|B)}{P(L)}$|Tính $P(L)$ trước;Rồi chia;Bẫy: lấy 5% làm đáp án'),
M('s3',2,'mcq','Cơ bản','Biến ngẫu nhiên $X$ có $P(X=0)=0{,}3$, $P(X=1)=0{,}5$, $P(X=2)=0{,}2$. Kỳ vọng $E(X)$ bằng?',['$0{,}7$','$0{,}9$','$1{,}0$','$1{,}2$'],1,'$E(X)=\\sum x_iP_i$','$E(X)=0\\cdot0{,}3+1\\cdot0{,}5+2\\cdot0{,}2=0{,}9$.','dice_3d',{label:'Biến rời rạc 3 giá trị'},'Kỳ vọng;Chương 2|Bảng phân phối 3 giá trị|$E(X)=\\sum x_ip_i$|Nhân từng cặp;Cộng lại;Bẫy: quên giá trị 0'),
M('s4',3,'mcq','Vận dụng','Điểm thi $X\\sim N(100,15^2)$. Xác suất $P(X>115)$ gần nhất với?',['$0{,}0228$','$0{,}1587$','$0{,}3413$','$0{,}8413$'],1,'Chuẩn hoá $Z=\\frac{X-\\mu}{\\sigma}$.','$Z=\\frac{115-100}{15}=1$ nên $P=1-\\Phi(1)=0{,}1587$.','bellcurve_3d',{mu:100,sigma:15,label:'N(100; 15²)'},'Phân phối chuẩn;Chương 3|$\\mu=100;\\sigma=15$; cần $P(X>115)$|$Z=\\frac{X-\\mu}{\\sigma}$|Chuẩn hoá;Tra bảng $\\Phi(1)$;Bẫy: quên lấy phần bù'),
M('s5',4,'mcq','Vận dụng','Mẫu: 4, 6, 8, 10, 12. Phương sai mẫu hiệu chỉnh $s^2$ bằng?',['$8$','$10$','$12{,}5$','$40$'],1,'Chia cho $n-1$, không phải $n$.','$\\bar x=8$; $\\sum(x_i-\\bar x)^2=40$; $s^2=\\frac{40}{4}=10$.','bellcurve_3d',{mu:8,sigma:3,label:'n=5, x̄=8'},'Đặc trưng mẫu;Chương 4|$n=5$;Dữ liệu 4–12|$s^2=\\frac{\\sum(x_i-\\bar x)^2}{n-1}$|Tính trung bình;Tổng bình phương lệch;Bẫy: chia cho $n$'),
M('s6',5,'mcq','Vận dụng cao','Đo thân nhiệt 100 bệnh nhân: $\\bar x=36{,}8$, độ lệch chuẩn tổng thể $\\sigma=0{,}5$. Khoảng tin cậy 95% cho trung bình là?',['$(36{,}70;\\,36{,}90)$','$(36{,}50;\\,37{,}10)$','$(36{,}79;\\,36{,}81)$','$(36{,}60;\\,37{,}00)$'],0,'Sai số $=z_{\\alpha/2}\\sigma/\\sqrt n$.','Sai số $=1{,}96\\cdot0{,}5/10\\approx0{,}098$ nên khoảng $(36{,}70;36{,}90)$.','medical_3d',{p:0.15,label:'n=100 bệnh nhân'},'Khoảng ước lượng;Chương 5 – y tế|$n=100;\\bar x=36,8;\\sigma=0,5$|$\\bar x\\pm z_{0,025}\\frac{\\sigma}{\\sqrt n}$|Tính sai số;Cộng trừ quanh $\\bar x$;Bẫy: quên căn $n$'),
M('s7',6,'mcq','Vận dụng','Kiểm định $H_0:\\mu=50$, $n=36$, $\\bar x=52$, $\\sigma=6$. Thống kê kiểm định $z$ bằng?',['$1$','$2$','$3$','$12$'],1,'$z=\\frac{\\bar x-\\mu_0}{\\sigma/\\sqrt n}$','$z=\\frac{52-50}{6/6}=2$.','bellcurve_3d',{mu:50,sigma:6,label:'H0: μ=50'},'Kiểm định z;Chương 6|$\\mu_0=50;n=36;\\bar x=52$|$z=\\frac{\\bar x-\\mu_0}{\\sigma/\\sqrt n}$|Tính sai số chuẩn $=1$;Chia;So với $z_{crit}$;Bẫy: nhầm $\\sigma$ với $\\sigma/\\sqrt n$'),
M('s8',7,'mcq','Vận dụng cao','Hai danh mục đầu tư, mỗi bên 50 phiên, $\\sigma_1=\\sigma_2=10$, lợi nhuận TB 105 và 100. Thống kê $z$ so sánh 2 trung bình?',['$1{,}25$','$2{,}5$','$5$','$0{,}5$'],1,'Sai số chuẩn $=\\sqrt{\\sigma_1^2/n_1+\\sigma_2^2/n_2}$.','$SE=\\sqrt{2+2}=2$; $z=\\frac{5}{2}=2{,}5$.','finance_3d',{mu:2.5,label:'105 vs 100'},'So sánh 2 trung bình;Chương 7 – tài chính|$n_1=n_2=50;\\sigma=10$; chênh lệch 5|$z=\\frac{\\bar x_1-\\bar x_2}{\\sqrt{\\sigma_1^2/n_1+\\sigma_2^2/n_2}}$|Tính SE;Chia;Bẫy: quên cộng hai phương sai'),

const rgb=(c,k)=>`rgb(${c.map(v=>Math.min(255,v*k|0))})`;
function box(x,y,z,w,h,d,c){const a=x-w/2,b=x+w/2,z0=z-d/2,z1=z+d/2,y1=y+h;
 return[[[[a,y1,z0],[b,y1,z0],[b,y1,z1],[a,y1,z1]],c,1.12],[[[a,y,z0],[b,y,z0],[b,y1,z0],[a,y1,z0]],c,.9],[[[a,y,z1],[b,y,z1],[b,y1,z1],[a,y1,z1]],c,.7],[[[a,y,z0],[a,y,z1],[a,y1,z1],[a,y1,z0]],c,.8],[[[b,y,z0],[b,y,z1],[b,y1,z1],[b,y1,z0]],c,.6]].map(f=>({v:f[0],col:rgb(f[1],f[2])}))}
function scene(type,t,p){const o={polys:[],dots:[],txt:[]},hash=n=>((n*9301+49297)%233280)/233280;
 if(type==='dice_3d'){const s=60;o.polys=box(0,-s,0,2*s,2*s,2*s,[255,236,160]);
  [['1',[0,0,-s]],['6',[0,0,s]],['3',[-s,0,0]],['4',[s,0,0]],['2',[0,s,0]],['5',[0,-s,0]]].forEach(f=>o.txt.push({t:f[0],p:f[1]}))}
 else if(type==='factory_3d'){const pr=p.p||.1;o.polys=box(0,-16,0,460,16,80,[130,130,160]);
  for(let k=0;k<8;k++){const u=k*60+t*50,id=k+8*Math.floor(u/480),x=(u%480)-240,bad=hash(id+1)<pr*2.2;
   o.polys.push(...box(x,0,0,32,28,32,bad?[255,120,130]:[120,225,175]))}
  o.polys.push(...box(0,0,-44,6,70,6,[255,220,90]),...box(0,0,44,6,70,6,[255,220,90]),...box(0,64,0,6,6,94,[255,220,90]))}
 else if(type==='bellcurve_3d'){const s=Math.max(.3,(p.sigma||15)/15);
  for(let i=-6;i<=6;i++)for(let j=-3;j<=3;j++){const h=(150/Math.sqrt(s))*Math.exp(-i*i/(8*s*s))*Math.exp(-j*j/6)*(1+.08*Math.sin(t*3+i+j))+4,k=Math.min(1,h/150);
   o.polys.push(...box(i*26,0,j*26,22,h,22,[180-70*k|0,150+80*k|0,255-60*k|0]))}}
 else if(type==='medical_3d'){const pr=p.p||.2;for(let k=0;k<70;k++){const y=1-2*k/69,r=Math.sqrt(1-y*y),a=k*2.4+t*.5;
   o.dots.push({p:[95*r*Math.cos(a),95*y,95*r*Math.sin(a)],r:8,c:hash(k+3)<pr?'#FF7A8A':'#8FF0C8'})}}
 else if(type==='queue_3d'){o.polys=box(0,-30,-70,120,60,60,[190,170,255]);for(let k=0;k<8;k++){const u=(k*70+t*60)%560;o.polys.push(...box(-280+u,-10,40,26,26,26,[255,200,120]))}}
 else if(type==='sampling_3d'){for(let k=0;k<60;k++){const y=1-2*k/59,r=Math.sqrt(1-y*y),a=k*2.4+t*.4,hi=hash(k)<.15;o.dots.push({p:[120*r*Math.cos(a),120*y,120*r*Math.sin(a)],r:hi?11:6,c:hi?'#FFD166':'#B79CF5'})}o.txt.push({t:'x̄',p:[0,-150,0]})}
 else if(type==='abtest_3d'){const hA=90+30*Math.sin(t),hB=110+30*Math.cos(t);o.polys.push(...box(-90,0,0,90,hA,50,[120,225,175]),...box(90,0,0,90,hB,50,[255,150,160]));o.txt.push({t:'A',p:[-90,hA+20,0]},{t:'B',p:[90,hB+20,0]})}
 else if(type==='dice_cards_3d'){for(let i=0;i<5;i++){o.polys.push(...box(i*44-88,0,0,34,48,4,i%2?[255,236,160]:[255,210,220]))}}
 else{for(let i=0;i<12;i++){const h=(40+90*Math.abs(Math.sin(i*1.3+1)))*(1+.1*Math.sin(t*2+i))+(p.mu||0)*i*3,up=i%3!==0;
   o.polys.push(...box(i*34-187,0,0,26,h,40,up?[120,225,175]:[255,150,160]))}}
 return o}
function draw(c,dt){const g=c.getContext('2d'),q=QM[c.dataset.q];if(!q)return;if(c.__run!==false)c.__t=(c.__t||0)+dt;const t=c.__t||0,W=c.width,H=c.height;
 const sc=scene(q.viz,t,q.vp||{}),ry=(c.__ry||0)+(q.viz==='dice_3d'?t*.8:Math.sin(t*.4)*.5+.4),rx=.5;
 const P=v=>{let[x,y,z]=v,co=Math.cos(ry),si=Math.sin(ry);[x,z]=[x*co+z*si,-x*si+z*co];co=Math.cos(rx);si=Math.sin(rx);[y,z]=[y*co+z*si,-y*si+z*co];const f=420/(420+z);return[W/2+x*f,H*.62-y*f,z,f]};
 const items=[];
 sc.polys.forEach(f=>{const pp=f.v.map(P);items.push({z:pp.reduce((s,a)=>s+a[2],0)/4,fn:()=>{g.beginPath();pp.forEach((a,i)=>i?g.lineTo(a[0],a[1]):g.moveTo(a[0],a[1]));g.closePath();g.fillStyle=f.col;g.fill();g.strokeStyle='rgba(45,42,74,.6)';g.stroke()}})});
 sc.dots.forEach(d=>{const a=P(d.p);items.push({z:a[2],fn:()=>{g.beginPath();g.arc(a[0],a[1],d.r*a[3],0,7);g.fillStyle=d.c;g.fill()}})});
 sc.txt.forEach(d=>{const a=P(d.p);items.push({z:a[2]-1,fn:()=>{g.fillStyle='#2D2A4A';g.font='900 34px Nunito';g.textAlign='center';g.fillText(d.t,a[0],a[1]+12)}})});
 g.clearRect(0,0,W,H);items.sort((a,b)=>b.z-a.z).forEach(i=>i.fn());
 g.fillStyle='#fff';g.font='800 14px Nunito';g.textAlign='left';g.fillText('🎲 '+(q.vp&&q.vp.label||'Mô phỏng')+' · kéo chuột để xoay',10,H-10)}
let lastT=performance.now();
function loop(n){const dt=Math.min(.05,(n-lastT)/1000);lastT=n;document.querySelectorAll('canvas.sc').forEach(c=>{try{draw(c,dt)}catch(e){}});requestAnimationFrame(loop)}
requestAnimationFrame(loop);

 let h=`<div class="font-bold text-lg my-2">${q.q}</div>`;

 else{h+=`<textarea class="w-full" rows="4" placeholder="Viết bài giải của bạn (có thể dùng $công thức$)..." oninput="U('${q.id}').essay=this.value">${esc(u.essay||'')}</textarea>

 if(!rev)h+=`<button class="bt" onclick="U('${q.id}').hint=1;updQ('${q.id}','${mode}')">💡 Gợi ý nhẹ</button><button class="bt" onclick="U('${q.id}').sol=!U('${q.id}').sol;updQ('${q.id}','${mode}')">📖 Lời giải chi tiết</button>`;

 return h}

function vBlock(b,qid,noans){return `<div class="mt-3 p-3 rounded-2xl bg-white border-2 border-[#2D2A4A]"><div class="flex items-center gap-3 flex-wrap"><button class="bt text-sm" onclick="vToggle('${b}','${qid||''}',${!!noans})">🎙️ Hỏi bằng giọng nói</button><span class="wv" data-b="${b}"><i></i><i></i><i></i><i></i><i></i></span><span class="text-sm font-bold" id="s_${b}"></span></div><div class="mt-2 text-sm" id="o_${b}"></div></div>`}
function vInit(){const r=new SR();r.lang='vi-VN';r.interimResults=true;r.continuous=false;
 r.onresult=e=>{if(r!==vRec)return;let t='';for(const x of e.results)t+=x[0].transcript;const sub=$('#s_'+VT);if(sub)sub.textContent='🗣️ '+t;if(e.results[e.results.length-1].isFinal)vAsk(t.trim())};
 r.onend=()=>{if(r===vRec){vOn=false;vUI()}};r.onerror=()=>{if(r===vRec){vOn=false;vUI()}};return r}
function vToggle(b,qid,noans){if(!SR)return toast('Trình duyệt chưa hỗ trợ giọng nói, hãy dùng Chrome hoặc Edge 🎙️');
 if(vOn&&VT===b){vRec.stop();return}
 if(vRec&&vOn)vRec.stop();
 VT=b;VNOANS=!!noans;if(qid)VQ=qid;vRec=vInit();vOn=true;vUI();
 try{vRec.start()}catch(e){vOn=false;vUI()}}
function vUI(){document.querySelectorAll('.wv').forEach(w=>w.classList.toggle('on',vOn&&w.dataset.b===VT))}
function speak(t){if(!speakOn||!('speechSynthesis' in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(String(t).replace(/\$\$?/g,'').replace(/\\[a-zA-Z]+/g,' ').replace(/[{}^_\\]/g,' '));u.lang='vi-VN';speechSynthesis.speak(u)}
async function vAsk(t){const out=$('#o_'+VT);if(!t||!out)return;out.innerHTML='🦉 Cú đang suy nghĩ...';
 const q=VQ&&allQ().find(x=>x.id===VQ);
 if(!KEY){const r='Nhập API Key để Cú Đêm trả lời bằng giọng nói nha 🦉';out.textContent=r;return speak(r)}
 try{const r=await ai([{role:'user',parts:[{text:t}]}],'Bạn là Giáo sư Cú Đêm, trả lời vấn đáp bằng tiếng Việt, ngắn gọn 3-5 câu, thân thiện, gợi mở kiểu Socratic khi có thể. Công thức LaTeX dùng $...$.'+(q?`\nĐề đang làm: ${q.q}\n${VNOANS?'Đây là bài thi: tuyệt đối không tiết lộ đáp án, chỉ gợi ý nhẹ.':'Lời giải mẫu: '+q.sol}`:''));

 ST.ch=q.ch;ST.type='all';ST.lv='all';ST.pi=Math.max(0,filtered().findIndex(x=>x.id===id));go('practice')}

 <div class="flex gap-2 flex-wrap mt-4"><button class="bt" onclick="analyzeMiss()">🦉 AI Phân Tích Hồ Sơ & Lỗi Sai</button><button class="bt" onclick="remed()">🎯 Tạo Bộ Bài Tập Khắc Phục Lỗ Hổng</button><button class="bt" onclick="clearMiss()">🗑️ Xoá lịch sử lỗi</button></div><div id="ana" class="mt-4"></div>
 <h3 class="font-black mt-5">Lịch sử câu sai gần đây</h3><div class="max-h-48 overflow-y-auto">${miss.length?miss.slice().reverse().slice(0,20).map(m=>`<div class="opt" onclick="reviewMiss('${m.id}')"><b>[Ch ${m.ch} · ${MODES[m.mode]}]</b>${m.q}<br><span class="text-sm">Đáp án: ${m.ans}</span></div>`).join(''):'<p>Chưa có lỗi sai nào. Giỏi quá 🎉</p>'}</div></div></div>`;tx()}
async function remed(){if(!KEY)return toast('Nhập API Key để Cú Đêm tạo bài nha 🦉');
 const tried=CH.map((_,i)=>i+1).filter(i=>ATT[i]&&ATT[i].n);const weak=tried.length?tried.sort((a,b)=>mastery(a)-mastery(b))[0]:1;
 toast('🦉 Đang soạn bộ bài khắc phục...');
 try{const r=await genAI({ch:weak,type:'mcq',lv:'Vận dụng',note:'tập trung vào dạng lỗi sinh viên hay sai ở chương này'},5);ST.gen.push(...r);ST.ch=weak;ST.pi=0;go('practice')}catch(e){toast('Lỗi: '+e.message)}}
async function analyzeMiss(){const el=$('#ana');if(!KEY)return toast('Nhập API Key để Cú Đêm phân tích nha 🦉');if(!miss.length)return toast('Chưa có lỗi sai nào để phân tích 🎉');

 </div><div class="pc p-4 md:col-span-3"><div class="p-3 rounded-2xl bg-[#F3EEFF] border-2 border-[#2D2A4A] mb-3"><b>✨ Tạo đề bài mới bằng AI cho Bảng iPad</b>

 initPad();rTutorSum();tx()}
function rTutorSum(){const el=$('#rsum');if(el)el.textContent='Tổng barem: '+RUBRIC.reduce((s,r)=>s+(+r.p||0),0)+' điểm'}
function snap(){const c=$('#ipad'),g=c.getContext('2d');PSTK.push(g.getImageData(0,0,c.width,c.height));if(PSTK.length>20)PSTK.shift()}
function initPad(){const c=$('#ipad'),g=c.getContext('2d');PSTK=[];down=false;
 const pos=e=>{const r=c.getBoundingClientRect();return[(e.clientX-r.left)*c.width/r.width,(e.clientY-r.top)*c.height/r.height]};
 c.onpointerdown=e=>{snap();down=true;c.setPointerCapture(e.pointerId);last=pos(e);g.globalCompositeOperation=PEN.e?'destination-out':'source-over';g.strokeStyle=PEN.c;g.lineWidth=PEN.e?30:PEN.w;g.lineCap='round';g.lineJoin='round'};
 c.onpointermove=e=>{if(!down)return;const p=pos(e);g.beginPath();g.moveTo(last[0],last[1]);g.lineTo(p[0],p[1]);g.stroke();last=p};
 c.onpointerup=c.onpointercancel=()=>{down=false;PADIMG=c.toDataURL('image/png')}}
function undoPad(){const c=$('#ipad');if(PSTK.length)c.getContext('2d').putImageData(PSTK.pop(),0,0)}
function clearPad(){const c=$('#ipad');snap();c.getContext('2d').clearRect(0,0,c.width,c.height);PADIMG=''}
function symPad(s){const c=$('#ipad'),g=c.getContext('2d');snap();g.globalCompositeOperation='source-over';g.fillStyle=PEN.c;g.font='700 44px Nunito';g.fillText(s,60+Math.random()*380,110+Math.random()*250);PADIMG=c.toDataURL('image/png')}
function loadUp(inp){const f=inp.files[0];if(!f)return;if(!/image\/(png|jpeg)|application\/pdf/.test(f.type))return toast('Chỉ nhận ảnh PNG/JPG hoặc PDF nha 📎');
 const r=new FileReader();r.onload=()=>{upFile={mime:f.type,data:r.result.split(',')[1]};$('#upname').textContent='📎 '+f.name;
  $('#prev').innerHTML=f.type==='application/pdf'?`<div class="font-bold">📄 Đã đính kèm PDF: ${esc(f.name)}</div>`:`<img src="${r.result}" class="max-h-48 rounded-xl border-2 border-[#2D2A4A]">`};r.readAsDataURL(f)}
async function gradeTutor(){const all=[...BANK,...ST.gen];const q=all.find(x=>x.id===ST.tq)||all[0];const el=$('#tres');
 if(!KEY)return toast('Nhập API Key để Cú Đêm chấm nha 🦉');
 let src;
 if(upFile)src={mimeType:upFile.mime,data:upFile.data};
 else{if(!PSTK.length)return toast('Hãy viết bài lên bảng hoặc tải ảnh/PDF lên trước nhé ✍️');
  const c=$('#ipad'),t=document.createElement('canvas');t.width=c.width;t.height=c.height;const tg=t.getContext('2d');tg.fillStyle='#fff';tg.fillRect(0,0,t.width,t.height);tg.drawImage(c,0,0);
  src={mimeType:'image/png',data:t.toDataURL('image/png').split(',')[1]}}
 el.innerHTML='🦉 Cú Đêm đang đọc bài...';
 const prompt=`Đề: ${q.q}\nLời giải mẫu: ${q.sol}\nBarem:\n${RUBRIC.map(r=>`- ${r.k}:${r.p} điểm`).join('\n')}\nĐọc bài làm viết tay trong ảnh/PDF đính kèm. Chấm từng mục theo barem, chỉ rõ dòng nào sai công thức hoặc tính nhầm, nêu lời khuyên sửa. Cuối cùng ghi đúng dạng "Tổng: X/10". Tiếng Việt, công thức LaTeX dùng $...$.`;
 try{const t=await ai([{role:'user',parts:[{text:prompt},{inlineData:src}]}],'Bạn là Cú Đêm, giảng viên Gen Z chấm bài nghiêm túc và thân thiện.');
  el.innerHTML=`<div class="pc p-4 bg-[#EFFFF8]">${t.replace(/\n/g,'<br>')}</div>`;

async function fbFetch(path,method='GET',body=null){
 try{const opts={method,headers:{'Content-Type':'application/json'}};if(body!==null)opts.body=JSON.stringify(body);
  const r=await fetch(`${FB_URL}/${path}.json`,opts);return await r.json()}catch(e){return null}}
function shrink(src,w=560){return new Promise(res=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=w;c.height=im.height*w/im.width;const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.7))};im.onerror=()=>res('');im.src=src})}

async function syncFB(){
 const d=await fbFetch('posts');
 if(d&&typeof d==='object'){
   let chg=false;
   for(const id in d){
     const rPost=d[id];if(!rPost||!rPost.id)continue;
     const lPost=POSTS[id];
     const rCnt=Object.keys(rPost.comments||{}).length+Object.keys(rPost.likes||{}).length;
     const lCnt=lPost?(Object.keys(lPost.comments||{}).length+Object.keys(lPost.likes||{}).length):-1;
     if(!lPost||rCnt!==lCnt){POSTS[id]={...rPost,likes:rPost.likes||{},comments:rPost.comments||{}};chg=true}
   }
   if(chg&&ST.view==='forum'){const act=document.activeElement;if(!act||!['INPUT','TEXTAREA'].includes(act.tagName))render()}
 }
 await fbFetch(`users/${myUid()}`,'PUT',{name:myName(),av:myAvatar(),seen:Date.now()});
 const u=await fbFetch('users');if(u)USERS=u}
