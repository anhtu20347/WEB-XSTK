<style>
:root{--ink:#2D2A4A;--lav:#D9C9FF;--mint:#BFF1DC;--peach:#FFD2D0;--butter:#FFF1B8}
body{font-family:Nunito,system-ui,sans-serif;color:var(--ink);background:#F8FAFC;
background-image:radial-gradient(at 8% 5%,var(--lav) 0,transparent 38%),radial-gradient(at 92% 8%,var(--mint) 0,transparent 36%),radial-gradient(at 85% 90%,var(--peach) 0,transparent 38%),radial-gradient(at 8% 92%,var(--butter) 0,transparent 36%);background-attachment:fixed}
.pc{background:#fff;border:3px solid var(--ink);border-radius:1.5rem;box-shadow:0 6px 0 var(--ink)}
.bt{border:3px solid var(--ink);border-radius:1rem;box-shadow:0 4px 0 var(--ink);padding:.35rem .9rem;font-weight:800;background:var(--butter);transition:all .15s;cursor:pointer}
.bt:hover{transform:translateY(-4px);box-shadow:0 8px 0 var(--ink)}.bt:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.bt.on{background:var(--lav)}.bt:disabled{opacity:.5}
.tag{border:2px solid var(--ink);border-radius:999px;padding:0 .6rem;font-size:.75rem;font-weight:800}
.opt{display:block;width:100%;text-align:left;border:3px solid var(--ink);border-radius:1rem;padding:.55rem .9rem;margin:.35rem 0;background:#fff;font-weight:700;transition:all .15s}
.opt:hover:not(:disabled){transform:translateY(-3px);background:var(--butter)}
.opt.ok{background:#9BEFC8;animation:pop .4s}.opt.bad{background:#FFAFB0;animation:shake .4s}.opt.sel{background:var(--lav)}
.stage{background:linear-gradient(160deg,#2D2A4A,#4B3F8F);border-radius:1.2rem;border:3px solid var(--ink);position:relative;overflow:hidden}
.stage canvas{width:100%;display:block;touch-action:none;cursor:grab}
.stage button{position:absolute;right:.5rem;top:.5rem;font-size:.75rem}
.mm .br{border:3px solid var(--ink);border-radius:1rem;padding:.6rem;font-size:.85rem}.mm li{margin:.2rem 0 0 1rem;list-style:disc}
.root{display:inline-block;border:3px solid var(--ink);border-radius:999px;padding:.3rem 1rem;font-weight:900;background:var(--butter)}
textarea,input,select{border:3px solid var(--ink);border-radius:.9rem;padding:.35rem .7rem;background:#fff;font-weight:700;max-width:100%}
.blink{transform-box:fill-box;transform-origin:center;animation:blink 4s infinite}
.wave{transform-box:fill-box;transform-origin:10% 20%;animation:wave 1.2s ease-in-out infinite}
.float{animation:float 3s ease-in-out infinite}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes wave{0%,100%{transform:rotate(0)}50%{transform:rotate(-28deg)}}
@keyframes float{50%{transform:translateY(-8px)}}
@keyframes pop{50%{transform:scale(1.04)}}@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.wv{display:none;gap:3px;align-items:center;height:22px}.wv.on{display:inline-flex}
.wv i{display:inline-block;width:4px;height:18px;background:#2D2A4A;border-radius:4px;animation:bar .8s ease-in-out infinite}
.wv i:nth-child(2){animation-delay:.15s}.wv i:nth-child(3){animation-delay:.3s}.wv i:nth-child(4){animation-delay:.45s}.wv i:nth-child(5){animation-delay:.6s}
@keyframes bar{50%{transform:scaleY(.25)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>

const tx=()=>{try{window.MathJax&&MathJax.typesetPromise&&MathJax.typesetPromise()}catch(e){}};
const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.remove('hidden');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.add('hidden'),2600)};
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
let KEY='',MODEL='gemini-3.8-flash';
const ST={view:'home',ch:1,type:'all',lv:'all',gen:[],ex:null,cfg:{scope:'all',n:5,min:15},ui:{}};
const U=id=>ST.ui[id]||(ST.ui[id]={msgs:[],run:true});

function markDone(id){const d=new Date(),f=x=>x.toDateString();if(!prog.done.includes(id))prog.done.push(id);
 if(prog.last!==f(d)){const y=new Date(d-864e5);prog.streak=prog.last===f(y)?prog.streak+1:1;prog.last=f(d)}ls.set('prog',prog)}
function saveKey(){KEY=$('#key').value.trim();MODEL=$('#model').value.trim()||'gemini-3.8-flash';ls.set('cfg',{k:KEY,m:MODEL});toast(KEY?'Đã lưu Key rồi nhé! 🦉':'Đã xoá Key – dùng dữ liệu mẫu nha 🦉')}

/* ===== Linh vật Cú Đêm ===== */
const owl=(s=120,w=true)=>`<svg viewBox="0 0 200 200" width="${s}" height="${s}" aria-label="Cú Đêm"><polygon points="52,60 44,22 82,48" fill="#9C7BEF"/><polygon points="148,60 156,22 118,48" fill="#9C7BEF"/>
<ellipse cx="100" cy="122" rx="64" ry="64" fill="#B79CF5" stroke="#2D2A4A" stroke-width="4"/><ellipse cx="100" cy="146" rx="38" ry="40" fill="#FFF1D6"/>
<g fill="#9C7BEF" stroke="#2D2A4A" stroke-width="3"><ellipse cx="40" cy="135" rx="14" ry="28"/><ellipse class="${w?'wave':''}" cx="164" cy="132" rx="14" ry="28"/></g>
<circle cx="72" cy="98" r="24" fill="#fff" stroke="#2D2A4A" stroke-width="5"/><circle cx="128" cy="98" r="24" fill="#fff" stroke="#2D2A4A" stroke-width="5"/><line x1="96" y1="98" x2="104" y2="98" stroke="#2D2A4A" stroke-width="5"/>
<g class="blink"><circle cx="74" cy="100" r="10" fill="#2D2A4A"/><circle cx="126" cy="100" r="10" fill="#2D2A4A"/><circle cx="77" cy="96" r="3" fill="#fff"/><circle cx="129" cy="96" r="3" fill="#fff"/></g>
<polygon points="93,116 107,116 100,130" fill="#FFB84D" stroke="#2D2A4A" stroke-width="3"/>
<polygon points="48,52 100,30 152,52 100,72" fill="#2D2A4A"/><rect x="76" y="58" width="48" height="14" fill="#2D2A4A"/><line x1="152" y1="52" x2="156" y2="82" stroke="#FFC933" stroke-width="3"/><circle cx="156" cy="85" r="5" fill="#FFC933"/>
<g fill="#FFB84D" stroke="#2D2A4A" stroke-width="3"><ellipse cx="80" cy="186" rx="14" ry="6"/><ellipse cx="120" cy="186" rx="14" ry="6"/></g></svg>`;
$('#logo').innerHTML=owl(42,false);

/* ===== Gemini ===== */
async function ai(contents,sys){if(!KEY)throw new Error('nokey');
 if(typeof contents==='string')contents=[{role:'user',parts:[{text:contents}]}];
 const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${MODEL}:generateContent?key=${encodeURIComponent(KEY)}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({systemInstruction:{parts:[{text:sys||''}]},contents})});
 const j=await r.json();if(!r.ok)throw new Error(j.error&&j.error.message||r.status);
 return(j.candidates&&j.candidates[0].content.parts||[]).map(p=>p.text||'').join('')}
function safeJSON(t){t=String(t).replace(/```json|```/g,'').trim();const a=Math.min(...['[','{'].map(c=>t.indexOf(c)).filter(i=>i>=0)),b=Math.max(t.lastIndexOf(']'),t.lastIndexOf('}'));t=t.slice(a,b+1);
 try{return JSON.parse(t)}catch(e){return JSON.parse(t.replace(/(?<!\\)\\(?![\\"\/u])/g,'\\\\'))}}
const normQ=(o,i,def)=>({id:'g'+Date.now()+i,ch:+o.ch||def.ch||1,type:o.type==='essay'?'essay':'mcq',lv:o.lv||def.lv||'Vận dụng',q:o.q,opts:o.opts||[],ans:+o.ans||0,hint:o.hint||'',sol:o.sol||'',viz:o.visual3DType||o.viz||'bellcurve_3d',vp:o.vp||{},m:o.m||''});
async function genAI(def,n){const p=`Tạo ${n} bài toán Xác suất & Thống kê bằng tiếng Việt. Chương ${def.ch||'bất kỳ trong 7 chương'}, hình thức ${def.type==='essay'?'tự luận':'trắc nghiệm 4 đáp án'}, độ khó ${def.lv||'Vận dụng'}. Chỉ trả về JSON mảng, không markdown.${def.note?" Yêu cầu thêm: "+def.note+".":""} Công thức LaTeX dùng $...$ và PHẢI viết hai dấu gạch chéo ngược (\\\\frac). Mỗi phần tử: {"ch":số,"type":"mcq"|"essay","lv":"Cơ bản|Vận dụng|Vận dụng cao","q":"đề","opts":["A","B","C","D"],"ans":0-3,"hint":"gợi ý","sol":"lời giải chi tiết","visual3DType":"factory_3d|dice_3d|bellcurve_3d|medical_3d|finance_3d|queue_3d|sampling_3d|abtest_3d|dice_cards_3d","vp":{"mu":số,"sigma":số,"p":số 0-1,"label":"tóm tắt tham số"},"m":"Dạng toán;..|Dữ kiện;..|Công thức;..|Bước giải;Bẫy hay sai"}`;
 return safeJSON(await ai(p,'Bạn là Cú Đêm, trợ giảng Xác suất Thống kê.')).map((o,i)=>normQ(o,i,def))}

/* ===== Dữ liệu mẫu ===== */
const CH=['Xác suất và công thức tính xác suất','Biến ngẫu nhiên','Phân phối xác suất của biến ngẫu nhiên','Mẫu ngẫu nhiên và các số đặc trưng của mẫu','Khoảng ước lượng','Kiểm định giả thuyết trong thống kê','So sánh 2 tham số'];
const M=(id,ch,type,lv,q,opts,ans,hint,sol,viz,vp,m)=>({id,ch,type,lv,q,opts,ans,hint,sol,viz,vp,m});
const BANK=[
M('s1',1,'mcq','Cơ bản','Gieo một con xúc xắc cân đối. Xác suất xuất hiện mặt có số chấm chẵn là?',['$1/6$','$1/3$','$1/2$','$2/3$'],2,'Đếm số kết quả thuận lợi trên tổng số kết quả.','Có 3 mặt chẵn (2,4,6) trong 6 mặt: $P=\\frac{3}{6}=\\frac12$.','dice_3d',{label:'Xúc xắc 6 mặt cân đối'},'Xác suất cổ điển;Chương 1|Không gian mẫu 6 mặt|Biến cố: mặt chẵn|$P(A)=\\frac{|A|}{|\\Omega|}$'),
M('s2',1,'mcq','Vận dụng cao','Dây chuyền: máy A làm 60% sản phẩm, lỗi 2%; máy B làm 40%, lỗi 5%. Lấy ngẫu nhiên 1 sản phẩm thì thấy bị lỗi. Xác suất nó do máy B làm là?',['$0{,}25$','$0{,}5$','$0{,}625$','$0{,}75$'],2,'Dùng công thức xác suất đầy đủ rồi Bayes.','$P(L)=0{,}6\\cdot0{,}02+0{,}4\\cdot0{,}05=0{,}032$. $P(B|L)=\\frac{0{,}02}{0{,}032}=0{,}625$.','factory_3d',{p:0.032,label:'Lỗi tổng hợp 3,2%'},'Bayes;Chương 1 – dây chuyền sản xuất|$P(A)=0,6;P(B)=0,4;Lỗi A 2%, lỗi B 5%|$P(B|L)=\\frac{P(B)P(L|B)}{P(L)}$'),
M('s3',2,'mcq','Cơ bản','Biến ngẫu nhiên $X$ có $P(X=0)=0{,}3$, $P(X=1)=0{,}5$, $P(X=2)=0{,}2$. Kỳ vọng $E(X)$ bằng?',['$0{,}7$','$0{,}9$','$1{,}0$','$1{,}2$'],1,'$E(X)=\\sum x_iP_i$','$E(X)=0\\cdot0{,}3+1\\cdot0{,}5+2\\cdot0{,}2=0{,}9$.','dice_3d',{label:'Biến rời rạc 3 giá trị'},'Kỳ vọng;Chương 2|Bảng phân phối 3 giá trị|$E(X)=\\sum x_ip_i$'),
M('s4',3,'mcq','Vận dụng','Điểm thi $X\\sim N(100,15^2)$. Xác suất $P(X>115)$ gần nhất với?',['$0{,}0228$','$0{,}1587$','$0{,}3413$','$0{,}8413$'],1,'Chuẩn hoá $Z=\\frac{X-\\mu}{\\sigma}$.','$Z=\\frac{115-100}{15}=1$ nên $P=1-\\Phi(1)=0{,}1587$.','bellcurve_3d',{mu:100,sigma:15,label:'N(100; 15²)'},'Phân phối chuẩn;Chương 3|$\\mu=100;\\sigma=15$; cần $P(X>115)$|$Z=\\frac{X-\\mu}{\\sigma}$'),
M('s5',4,'mcq','Vận dụng','Mẫu: 4, 6, 8, 10, 12. Phương sai mẫu hiệu chỉnh $s^2$ bằng?',['$8$','$10$','$12{,}5$','$40$'],1,'Chia cho $n-1$, không phải $n$.','$\\bar x=8$; $\\sum(x_i-\\bar x)^2=40$; $s^2=\\frac{40}{4}=10$.','bellcurve_3d',{mu:8,sigma:3,label:'n=5, x̄=8'},'Đặc trưng mẫu;Chương 4|$n=5$;Dữ liệu 4–12|$s^2=\\frac{\\sum(x_i-\\bar x)^2}{n-1}$'),
M('s6',5,'mcq','Vận dụng cao','Đo thân nhiệt 100 bệnh nhân: $\\bar x=36{,}8$, độ lệch chuẩn tổng thể $\\sigma=0{,}5$. Khoảng tin cậy 95% cho trung bình là?',['$(36{,}70;\\,36{,}90)$','$(36{,}50;\\,37{,}10)$','$(36{,}79;\\,36{,}81)$','$(36{,}60;\\,37{,}00)$'],0,'Sai số $=z_{\\alpha/2}\\sigma/\\sqrt n$.','Sai số $=1{,}96\\cdot0{,}5/10\\approx0{,}098$ nên khoảng $(36{,}70;36{,}90)$.','medical_3d',{p:0.15,label:'n=100 bệnh nhân'},'Khoảng ước lượng;Chương 5 – y tế|$n=100;\\bar x=36,8;\\sigma=0,5$|$\\bar x\\pm z_{0,025}\\frac{\\sigma}{\\sqrt n}$'),
M('s7',6,'mcq','Vận dụng','Kiểm định $H_0:\\mu=50$, $n=36$, $\\bar x=52$, $\\sigma=6$. Thống kê kiểm định $z$ bằng?',['$1$','$2$','$3$','$12$'],1,'$z=\\frac{\\bar x-\\mu_0}{\\sigma/\\sqrt n}$','$z=\\frac{52-50}{6/6}=2$.','bellcurve_3d',{mu:50,sigma:6,label:'H0: μ=50'},'Kiểm định z;Chương 6|$\\mu_0=50;n=36;\\bar x=52$|$z=\\frac{\\bar x-\\mu_0}{\\sigma/\\sqrt n}$'),
M('s8',7,'mcq','Vận dụng cao','Hai danh mục đầu tư, mỗi bên 50 phiên, $\\sigma_1=\\sigma_2=10$, lợi nhuận TB 105 và 100. Thống kê $z$ so sánh 2 trung bình?',['$1{,}25$','$2{,}5$','$5$','$0{,}5$'],1,'Sai số chuẩn $=\\sqrt{\\sigma_1^2/n_1+\\sigma_2^2/n_2}$.','$SE=\\sqrt{2+2}=2$; $z=\\frac{5}{2}=2{,}5$.','finance_3d',{mu:2.5,label:'105 vs 100'},'So sánh 2 trung bình;Chương 7 – tài chính|$n_1=n_2=50;\\sigma=10$; chênh lệch 5|$z=\\frac{\\bar x_1-\\bar x_2}{\\sqrt{\\sigma_1^2/n_1+\\sigma_2^2/n_2}}$'),
M('s9',1,'essay','Vận dụng cao','Lô hàng 10 sản phẩm có 3 sản phẩm lỗi. Lấy ngẫu nhiên 2 sản phẩm không hoàn lại. Tính xác suất có đúng 1 sản phẩm lỗi.',[],0,'Dùng tổ hợp: chọn 1 lỗi trong 3 và 1 tốt trong 7.','$P=\\frac{C_3^1C_7^1}{C_{10}^2}=\\frac{21}{45}=\\frac{7}{15}$.','factory_3d',{p:0.3,label:'3/10 lỗi'},'Xác suất tổ hợp;Chương 1|10 sp, 3 lỗi;Lấy 2 không hoàn lại|$\\frac{C_3^1C_7^1}{C_{10}^2}$'),
M('s10',3,'essay','Vận dụng','Mỗi sản phẩm lỗi với xác suất $0{,}1$ độc lập. Kiểm tra 5 sản phẩm, tính xác suất có ít nhất 1 sản phẩm lỗi.',[],0,'Dùng biến cố đối: không có sản phẩm lỗi nào.','$X\\sim B(5;0{,}1)$; $P(X\\ge1)=1-0{,}9^5\\approx0{,}4095$.','factory_3d',{p:0.1,label:'X~B(5; 0,1)'},'Phân phối nhị thức;Chương 3|$n=5;p=0,1$|$P(X\\ge1)=1-P(X=0)$')];
const SAMPLE_EXAM=BANK.filter(q=>q.type==='mcq');

/* ===== Mô phỏng 3D ===== */
const rgb=(c,k)=>`rgb(${c.map(v=>Math.min(255,v*k|0))})`;
function box(x,y,z,w,h,d,c){const a=x-w/2,b=x+w/2,z0=z-d/2,z1=z+d/2,y1=y+h;
 return[[[[a,y1,z0],[b,y1,z0],[b,y1,z1],[a,y1,z1]],c,1.12],[[[a,y,z0],[b,y,z0],[b,y1,z0],[a,y1,z0]],c,.9],[[[a,y,z1],[b,y,z1],[b,y1,z1],[a,y1,z1]],c,.7],[[[a,y,z0],[a,y,z1],[a,y1,z1],[a,y1,z0]],c,.8],[[[b,y,z0],[b,y,z1],[b,y1,z1],[b,y1,z0]],c,.6]].map(f=>({v:f[0],col:rgb(f[1],f[2])}))}
function scene(type,t,p){const o={polys:[],dots:[],txt:[]},hash=n=>((n*9301+49297)%233280)/233280;
 if(type==='dice_3d'){const s=60;o.polys=box(0,-s,0,2*s,2*s,2*s,[255,236,160]);
  [['1',[0,0,-s]],['6',[0,0,s]],['3',[-s,0,0]],['4',[s,0,0]],['2',[0,s,0]],['5',[0,-s,0]]].forEach(f=>o.txt.push({t:f[0],p:f[1]}))}
 else if(type==='factory_3d'){const pr=p.p||.1;o.polys=box(0,-16,0,460,16,80,[130,130,160]);
  for(let k=0;k<8;k++){const u=k*60+t*50,id=k+8*Math.floor(u/480),x=(u%480)-240,bad=hash(id+1)<pr*2.2;
   o.polys.push(...box(x,0,0,32,28,32,bad?[255,120,130]:[120,225,175]))}
  o.polys.push(...box(0,0,-44,6,70,6,[255,220,90]),...box(0,0,44,6,70,6,[255,220,90]),...box(0,64,0,6,6,94,[255,220,90]))}
 else if(type==='bellcurve_3d'){const s=Math.max(.3,(p.sigma||15)/15);
  for(let i=-6;i<=6;i++)for(let j=-3;j<=3;j++){const h=(150/Math.sqrt(s))*Math.exp(-i*i/(8*s*s))*Math.exp(-j*j/6)*(1+.08*Math.sin(t*3+i+j))+4,k=Math.min(1,h/150);
   o.polys.push(...box(i*26,0,j*26,22,h,22,[180-70*k|0,150+80*k|0,255-60*k|0]))}}
 else if(type==='medical_3d'){const pr=p.p||.2;for(let k=0;k<70;k++){const y=1-2*k/69,r=Math.sqrt(1-y*y),a=k*2.4+t*.5;
   o.dots.push({p:[95*r*Math.cos(a),95*y,95*r*Math.sin(a)],r:8,c:hash(k+3)<pr?'#FF7A8A':'#8FF0C8'})}}
 else if(type==='queue_3d'){o.polys=box(0,-30,-70,120,60,60,[190,170,255]);for(let k=0;k<8;k++){const u=(k*70+t*60)%560;o.polys.push(...box(-280+u,-10,40,26,26,26,[255,200,120]))}}
 else if(type==='sampling_3d'){for(let k=0;k<60;k++){const y=1-2*k/59,r=Math.sqrt(1-y*y),a=k*2.4+t*.4,hi=hash(k)<.15;o.dots.push({p:[120*r*Math.cos(a),120*y,120*r*Math.sin(a)],r:hi?11:6,c:hi?'#FFD166':'#B79CF5'}
  )}o.txt.push({t:'x̄',p:[0,-150,0]})}
 else if(type==='abtest_3d'){const hA=90+30*Math.sin(t),hB=110+30*Math.cos(t);o.polys.push(...box(-90,0,0,90,hA,50,[120,225,175]),...box(90,0,0,90,hB,50,[255,150,160]));o.txt.push({t:'A',p:[-90,hA+20,0]},{t:'B',p:[90,hB+20,0]})}
 else if(type==='dice_cards_3d'){for(let i=0;i<5;i++){o.polys.push(...box(i*44-88,0,0,34,48,4,i%2?[255,236,160]:[255,210,220]))}}
 else{for(let i=0;i<12;i++){const h=(40+90*Math.abs(Math.sin(i*1.3+1)))*(1+.1*Math.sin(t*2+i))+(p.mu||0)*i*3,up=i%3!==0;
   o.polys.push(...box(i*34-187,0,0,26,h,40,up?[120,225,175]:[255,150,160]))}}
 return o}
function draw(c,dt){const g=c.getContext('2d'),q=QM[c.dataset.q];if(!q)return;if(c.__run!==false)c.__t=(c.__t||0)+dt;const t=c.__t||0,W=c.width,H=c.height;
 const sc=scene(q.viz,t,q.vp||{}),ry=(c.__ry||0)+(q.viz==='dice_3d'?t*.8:Math.sin(t*.4)*.5+.4),rx=.5;
 const P=v=>{let[x,y,z]=v,co=Math.cos(ry),si=Math.sin(ry);[x,z]=[x*co+z*si,-x*si+z*co];co=Math.cos(rx);si=Math.sin(rx);[y,z]=[y*co+z*si,-y*si+z*co];const f=420/(420+z);return[W/2+x*f,H*.62-y*f,z,f]};
 const items=[];
 sc.polys.forEach(f=>{const pp=f.v.map(P);items.push({z:pp.reduce((s,a)=>s+a[2],0)/4,fn:()=>{g.beginPath();pp.forEach((a,i)=>i?g.lineTo(a[0],a[1]):g.moveTo(a[0],a[1]));g.closePath();g.fillStyle=f.col;g.fill();g.strokeStyle='rgba(45,42,74,.6)';g.stroke()}})});
 sc.dots.forEach(d=>{const a=P(d.p);items.push({z:a[2],fn:()=>{g.beginPath();g.arc(a[0],a[1],d.r*a[3],0,7);g.fillStyle=d.c;g.fill()}})});
 sc.txt.forEach(d=>{const a=P(d.p);items.push({z:a[2]-1,fn:()=>{g.fillStyle='#2D2A4A';g.font='900 34px Nunito';g.textAlign='center';g.fillText(d.t,a[0],a[1]+12)}})});
 g.clearRect(0,0,W,H);items.sort((a,b)=>b.z-a.z).forEach(i=>i.fn());
 g.fillStyle='#fff';g.font='800 14px Nunito';g.textAlign='left';g.fillText('🎲 '+(q.vp&&q.vp.label||'Mô phỏng')+' · kéo chuột để xoay',10,H-10)}

function initPad(){const c=$('#ipad'),g=c.getContext('2d');PSTK=[];down=false;
 const pos=e=>{const r=c.getBoundingClientRect();return[(e.clientX-r.left)*c.width/r.width,(e.clientY-r.top)*c.height/r.height]};
 c.onpointerdown=e=>{snap();down=true;c.setPointerCapture(e.pointerId);last=pos(e);g.globalCompositeOperation=PEN.e?'destination-out':'source-over';g.strokeStyle=PEN.c;g.lineWidth=PEN.e?30:PEN.w;g.lineCap='round';g.lineJoin='round'};
 c.onpointermove=e=>{if(!down)return;const p=pos(e);g.beginPath();g.moveTo(last[0],last[1]);g.lineTo(p[0],p[1]);g.stroke();last=p};
 c.onpointerup=c.onpointercancel=()=>{down=false}}

 <button class="bt ml-auto" onclick="pubPost()">📮 Đăng bài</button></div>`:'<p class="text-center font-bold text-red-500 py-3">🔐 Vui lòng bấm "Đăng nhập Google" ở thanh trên cùng để tham gia thảo luận và đăng bài!</p>'}</div>`}
function postHTML(x){const likes=x.likes||{};const ks=Object.values(likes).filter(Boolean);const cnt=k=>ks.filter(v=>v===k).length;const mine=currentUser&&likes[currentUser.uid];
 const cms=Object.values(x.comments||{}).sort((a,b)=>a.t-b.t);
 return `<article class="pc p-4"><div class="flex items-center gap-2">${x.aa?`<img src="${x.aa}" class="w-8 h-8 rounded-full border">`:'<span class="text-2xl">🙂</span>'}<div><b>${esc(x.an||'Ẩn danh')}</b><div class="text-xs">${new Date(x.t).toLocaleString('vi-VN')} · Ch ${x.ch||'?'}</div></div></div>
 <h3 class="font-black mt-2">${esc(x.title)}</h3><div class="mt-1">${esc(x.body).replace(/\n/g,'<br>')}</div>
 <div class="flex flex-wrap gap-2 mt-3">${REACTS.map(([k,l])=>`<button class="bt text-xs ${mine===k?'on':''}" onclick="react('${x.id}','${k}')">${l}${cnt(k)}</button>`).join('')}<button class="bt text-xs" onclick="aiReply('${x.id}')">🦉 Tag Cú Đêm AI</button></div>
 <div class="mt-3 space-y-2">${cms.map(c=>`<div class="rounded-2xl bg-[#F8FAFC] border-2 border-[#2D2A4A] p-2 text-sm"><b>${c.an}:</b>${esc(c.body).replace(/\n/g,'<br>')}</div>`).join('')}</div>
 ${currentUser?`<div class="flex gap-2 mt-2"><input class="flex-1" placeholder="Bình luận..." value="${attr(ST.cd[x.id]||'')}" oninput="ST.cd['${x.id}']=this.value" onkeydown="if(event.key==='Enter')cmt('${x.id}')"><button class="bt text-sm" onclick="cmt('${x.id}')">Gửi</button></div>`:''}</div></article>`}
function rForum(a){const now=Date.now();const posts=Object.values(POSTS).sort((x,y)=>y.t-x.t);
 const online=Object.entries(USERS).filter(([u,v])=>!currentUser||u!==currentUser.uid).filter(([u,v])=>v.seen&&now-v.seen<120000);
 a.innerHTML=`<div class="grid md:grid-cols-12 gap-4"><aside class="md:col-span-3 space-y-4"><div class="pc p-4 text-center">
 ${currentUser?`<img src="${currentUser.photoURL}" class="w-16 h-16 rounded-full mx-auto border-2 border-[#2D2A4A]"><b class="block mt-2">${esc(currentUser.displayName)}</b>`:'<b>Chưa đăng nhập</b>'}</div>
 <div class="pc p-4"><b>🟢 Thành viên online</b>${online.length?online.map(([u,v])=>`<div class="flex items-center gap-2 mt-2 text-sm">${v.av?`<img src="${v.av}" class="w-6 h-6 rounded-full">`:'<span>🙂</span>'}<span class="font-bold">${esc(v.name)}</span></div>`).join(''):'<p class="text-sm mt-2">Chưa có ai khác online.</p>'}</div></aside>
 <section class="md:col-span-6 space-y-4">${composeHTML()}${posts.map(postHTML).join('')}</section>
 <aside class="md:col-span-3 space-y-4"><div class="pc p-4"><b>🔥 Cẩm nang XSTK</b><p class="text-sm mt-2">Đăng nhập tài khoản Google để giao lưu trực tiếp với bạn bè toàn trường!</p></div></aside></div>`;tx()}
startSync();
