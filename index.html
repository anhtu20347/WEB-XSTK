<style>
:root{--ink:#2D2A4A;--lav:#D9C9FF;--mint:#BFF1DC;--peach:#FFD2D0;--butter:#FFF1B8}
body{font-family:Nunito,system-ui,sans-serif;color:var(--ink);background:#F8FAFC;
background-image:radial-gradient(at 8% 5%,var(--lav) 0,transparent 38%),radial-gradient(at 92% 8%,var(--mint) 0,transparent 36%),radial-gradient(at 85% 90%,var(--peach) 0,transparent 38%),radial-gradient(at 8% 92%,var(--butter) 0,transparent 36%);background-attachment:fixed}
.pc{background:#fff;color:#2D2A4A;border:3px solid var(--ink);border-radius:1.5rem;box-shadow:0 6px 0 var(--ink)}
.bt{border:3px solid var(--ink);border-radius:1rem;box-shadow:0 4px 0 var(--ink);padding:.35rem .9rem;font-weight:800;background:var(--butter);color:#2D2A4A;transition:all .15s;cursor:pointer}
.bt:hover{transform:translateY(-3px);box-shadow:0 7px 0 var(--ink)}
.bt:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.bt.on{background:var(--lav)}
.bt:disabled{opacity:.5;cursor:not-allowed}
.tag{border:2px solid var(--ink);border-radius:999px;padding:.1rem .65rem;font-size:.75rem;font-weight:800;color:#2D2A4A}
.opt{display:block;width:100%;text-align:left;border:3px solid var(--ink);border-radius:1rem;padding:.55rem .9rem;margin:.35rem 0;background:#fff;color:#2D2A4A;font-weight:700;transition:all .15s;cursor:pointer}
.opt:hover:not(:disabled){transform:translateY(-2px);background:var(--butter)}
.opt.ok{background:#9BEFC8;animation:pop .4s}
.opt.bad{background:#FFAFB0;animation:shake .4s}
.opt.sel{background:var(--lav)}
.stage{background:linear-gradient(160deg,#2D2A4A,#4B3F8F);border-radius:1.2rem;border:3px solid var(--ink);position:relative;overflow:hidden}
.stage canvas{width:100%;display:block;touch-action:none;cursor:grab}
.stage button{position:absolute;right:.5rem;top:.5rem;font-size:.75rem}
.mm .br{border:3px solid var(--ink);border-radius:1rem;padding:.6rem;font-size:.85rem;color:#2D2A4A}
.mm li{margin:.2rem 0 0 1rem;list-style:disc}
.root{display:inline-block;border:3px solid var(--ink);border-radius:999px;padding:.3rem 1rem;font-weight:900;background:var(--butter);color:#2D2A4A}
textarea,input,select{border:3px solid var(--ink);border-radius:.9rem;padding:.35rem .7rem;background:#fff;color:#2D2A4A;font-weight:700;max-width:100%}
.blink{transform-box:fill-box;transform-origin:center;animation:blink 4s infinite}
.wave{transform-box:fill-box;transform-origin:10% 20%;animation:wave 1.2s ease-in-out infinite}
.float{animation:float 3s ease-in-out infinite}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes wave{0%,100%{transform:rotate(0)}50%{transform:rotate(-28deg)}}
@keyframes float{50%{transform:translateY(-8px)}}
@keyframes pop{50%{transform:scale(1.03)}}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.wv{display:none;gap:3px;align-items:center;height:22px}
.wv.on{display:inline-flex}
.wv i{display:inline-block;width:4px;height:18px;background:#2D2A4A;border-radius:4px;animation:bar .8s ease-in-out infinite}
.wv i:nth-child(2){animation-delay:.15s}.wv i:nth-child(3){animation-delay:.3s}.wv i:nth-child(4){animation-delay:.45s}.wv i:nth-child(5){animation-delay:.6s}
@keyframes bar{50%{transform:scaleY(.25)}}
</style>

async function fbFetch(path, method, body){
  method = method || 'GET';
  try{
    var opts = { method:method, headers:{'Content-Type':'application/json'} };
    if(body !== undefined && body !== null) opts.body = JSON.stringify(body);
    var r = await fetch(FB_URL + '/' + path + '.json', opts);
    if(!r.ok) return null;
    return await r.json();
  }catch(e){ return null; }
}

function emailToKey(email){
  return String(email || '').trim().toLowerCase().replace(/[^a-z0-9]/g, '_');
}
function myUid(){ return currentUser ? currentUser.uid : ''; }
function myName(){ return currentUser ? currentUser.displayName : (PROF.name || 'Khách (Chưa đăng nhập)'); }
function myAvatar(){ return currentUser ? (currentUser.photoURL || currentUser.avatar || '🦊') : '🦉'; }

function initFirebase(){
  try{
    if(window.firebase && !firebase.apps.length){
      firebase.initializeApp(firebaseConfig);
    }
    if(window.firebase){
      auth = firebase.auth();
      auth.onAuthStateChanged(function(u){
        if(u){
          var uid = 'gg_' + u.uid;
          currentUser = {
            uid: uid,
            displayName: u.displayName || u.email,

          syncFB();
          if(ST.view === 'forum' || ST.view === 'stats') render();
        }

    }
  }catch(e){ console.warn('Firebase init:', e); }
}

function openAuthModal(tab){
  var m = $('#authModal'); if(!m) return;
  switchAuthTab(tab || 'login');
  m.classList.remove('hidden'); m.classList.add('flex');

function closeAuthModal(){
  var m = $('#authModal'); if(!m) return;

}
function switchAuthTab(tab){
  var isLogin = (tab === 'login');
  $('#formLogin').classList.toggle('hidden', !isLogin);
  $('#formRegister').classList.toggle('hidden', isLogin);
  $('#tabLoginBtn').classList.toggle('on', isLogin);
  $('#tabRegBtn').classList.toggle('on', !isLogin);
}

/* Tạo tài khoản mới (Tên, Gmail, Mật khẩu) lưu trực tiếp lên Firebase */
async function doRegister(){
  var name = ($('#rName').value || '').trim();
  var email = ($('#rEmail').value || '').trim().toLowerCase();
  var pass = ($('#rPass').value || '').trim();
  var av = ($('#rAvatar').value || '🦊');

  if(!name) return toast('⚠️ Vui lòng nhập Tên hiển thị của bạn!');
  if(!email || email.indexOf('@') < 1) return toast('⚠️ Vui lòng nhập địa chỉ Gmail hợp lệ!');
  if(pass.length < 4) return toast('⚠️ Mật khẩu cần có ít nhất 4 ký tự!');

  var eKey = emailToKey(email);
  toast('⏳ Đang kiểm tra và tạo tài khoản...');
  var existing = await fbFetch('accounts/' + eKey);
  if(existing && existing.email){
    return toast('⚠️ Tài khoản Gmail này đã được đăng ký! Vui lòng chuyển sang tab Đăng nhập.');
  }

  var uid = 'acc_' + eKey;
  var accData = {
    uid: uid,
    name: name,
    email: email,
    pass: btoa(unescape(encodeURIComponent(pass))),
    avatar: av,
    createdAt: Date.now()
  };

  await fbFetch('accounts/' + eKey, 'PUT', accData);
  await fbFetch('users/' + uid, 'PUT', { uid:uid, name:name, email:email, av:av, seen:Date.now() });

  currentUser = { uid:uid, displayName:name, email:email, photoURL:'', avatar:av };
  ls.set('session_user', currentUser);
  PROF.name = name; PROF.email = email; ls.set('prof', PROF);

  closeAuthModal();
  renderAuth();
  await syncFB();
  render();
  toast('🎉 Tạo tài khoản và đăng nhập thành công! Chào ' + name);
}

/* Đăng nhập bằng Gmail & Mật khẩu */
async function doLogin(){
  var email = ($('#lEmail').value || '').trim().toLowerCase();
  var pass = ($('#lPass').value || '').trim();
  if(!email || !pass) return toast('⚠️ Vui lòng nhập đầy đủ Gmail và Mật khẩu!');

  var eKey = emailToKey(email);
  toast('⏳ Đang xác thực tài khoản...');
  var acc = await fbFetch('accounts/' + eKey);
  if(!acc || !acc.uid){
    return toast('❌ Không tìm thấy tài khoản với Gmail này! Bạn hãy bấm "Tạo tài khoản" nhé.');
  }
  var encodedPass = btoa(unescape(encodeURIComponent(pass)));
  if(acc.pass !== encodedPass){
    return toast('❌ Mật khẩu chưa chính xác! Vui lòng kiểm tra lại.');
  }

  currentUser = {
    uid: acc.uid,
    displayName: acc.name,
    email: acc.email,
    photoURL: '',
    avatar: acc.avatar || '🦊'
  };
  ls.set('session_user', currentUser);
  PROF.name = acc.name; PROF.email = acc.email; ls.set('prof', PROF);

function U(id){ return ST.ui[id] || (ST.ui[id] = {msgs:[], run:true}); }
function markDone(id){
  var d = new Date(), f = d.toDateString();
  if(!prog.done.includes(id)) prog.done.push(id);
  if(prog.last !== f){
    var y = new Date(d - 86400000).toDateString();
    prog.streak = (prog.last === y) ? prog.streak + 1 : 1;
    prog.last = f;
  }
  ls.set('prog', prog);
}
function saveKey(){
  KEY = $('#key').value.trim();
  MODEL = $('#model').value.trim() || 'gemini-3.8-flash';
  ls.set('cfg', {k:KEY, m:MODEL});
  toast(KEY ? 'Đã lưu Key rồi nhé! 🦉' : 'Đã xoá Key – dùng dữ liệu mẫu nha 🦉');
}

async function callGeminiOnce(modelName, contents, sys){
  var url = 'https://generativelanguage.googleapis.com/v1beta/models/' + encodeURIComponent(modelName) + ':generateContent?key=' + encodeURIComponent(KEY);
  var r = await fetch(url, {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({
      systemInstruction: { parts: [{ text: sys || 'Bạn là trợ giảng Xác suất Thống kê.' }] },
      contents: contents
    })
  });
  var j = await r.json();
  if(!r.ok){
    var msg = (j.error && j.error.message) ? j.error.message : ('HTTP ' + r.status);
    throw new Error(msg);
  }
  var parts = (j.candidates && j.candidates[0] && j.candidates[0].content && j.candidates[0].content.parts) || [];
  return parts.map(function(p){ return p.text || ''; }).join('');
}

async function ai(contents, sys){
  if(!KEY) throw new Error('nokey');
  if(typeof contents === 'string') contents = [{role:'user', parts:[{text:contents}]}];
  var candidates = [MODEL, 'gemini-3.8-flash', 'gemini-3.0-flash', 'gemini-2.5-flash', 'gemini-2.0-flash', 'gemini-1.5-flash'];
  var tried = {}, lastErr = null;
  for(var i = 0; i < candidates.length; i++){
    var m = candidates[i];
    if(!m || tried[m]) continue;
    tried[m] = true;
    try{
      var res = await callGeminiOnce(m, contents, sys);
      if(m !== MODEL){
        MODEL = m;
        if($('#model')) $('#model').value = m;
        ls.set('cfg', {k:KEY, m:MODEL});
      }
      return res;
    }catch(e){
      lastErr = e;
      var match = String(e.message).match(/models\/(gemini-[a-z0-9.-]+)/i);
      if(match && match[1] && !tried[match[1]]) candidates.splice(i + 1, 0, match[1]);
    }
  }
  throw lastErr || new Error('Không thể kết nối Gemini API');
}

function safeJSON(t){
  t = String(t).replace(/```json|```/g,'').trim();
  var a = t.indexOf('['), b = t.lastIndexOf(']');
  if(a >= 0 && b > a) t = t.slice(a, b + 1);
  try{ return JSON.parse(t); }catch(e){}
  try{ return JSON.parse(t.replace(/\\(?![/bfnrtu"\\])/g, '\\\\')); }catch(e2){}
  var items = [], re = /\{[^{}]*\}/g, m;
  while((m = re.exec(t)) !== null){
    try{ items.push(JSON.parse(m[0])); }catch(e3){
      try{ items.push(JSON.parse(m[0].replace(/\\(?![/bfnrtu"\\])/g, '\\\\'))); }catch(e4){}
    }
  }
  if(items.length) return items;
  throw new Error('Dữ liệu AI trả về chưa đúng chuẩn JSON');
}

function buildPracticePack(ch, count){
  var results = [];
  for(var i = 0; i < count; i++){
    var id = 'local_' + ch + '_' + Date.now() + '_' + i;
    if(ch === 1){
      var rateA = 50 + (i % 4) * 10, rateB = 100 - rateA;
      var errA = 1 + (i % 3), errB = 2 + (i % 4);

function rgb(c, k){ return 'rgb(' + c.map(function(v){ return Math.min(255, (v * k) | 0); }).join(',') + ')'; }

    [[[a,y1,z0],[b,y1,z0],[b,y1,z1],[a,y1,z1]],c,1.12],
    [[[a,y,z0],[b,y,z0],[b,y1,z0],[a,y1,z0]],c,0.9],
    [[[a,y,z1],[b,y,z1],[b,y1,z1],[a,y1,z1]],c,0.7],
    [[[a,y,z0],[a,y,z1],[a,y1,z1],[a,y1,z0]],c,0.8],
    [[[b,y,z0],[b,y,z1],[b,y1,z1],[b,y1,z0]],c,0.6]

  return faces.map(function(f){ return {v:f[0], col:rgb(f[1],f[2])}; });
}
function scene(type, t, p){

  var hash = function(n){ return ((n * 9301 + 49297) % 233280) / 233280; };

    var s = 60; o.polys = box(0,-s,0,2*s,2*s,2*s,[255,236,160]);
    [['1',[0,0,-s]],['6',[0,0,s]],['3',[-s,0,0]],['4',[s,0,0]],['2',[0,s,0]],['5',[0,-s,0]]].forEach(function(f){ o.txt.push({t:f[0],p:f[1]}); });
  } else if(type === 'factory_3d'){
    var pr = p.p || 0.1; o.polys = box(0,-16,0,460,16,80,[130,130,160]);
    for(var k=0;k<8;k++){
      var u = k*60 + t*50, id = k + 8*Math.floor(u/480), x = (u%480) - 240, bad = hash(id+1) < pr*2.2;
      o.polys.push.apply(o.polys, box(x,0,0,32,28,32, bad ? [255,120,130] : [120,225,175]));
    }
    o.polys.push.apply(o.polys, box(0,0,-44,6,70,6,[255,220,90]));
    o.polys.push.apply(o.polys, box(0,0,44,6,70,6,[255,220,90]));
    o.polys.push.apply(o.polys, box(0,64,0,6,6,94,[255,220,90]));
  } else if(type === 'bellcurve_3d'){
    var s2 = Math.max(0.3, (p.sigma || 15) / 15);
    for(var i=-6;i<=6;i++) for(var j=-3;j<=3;j++){
      var h = (150/Math.sqrt(s2))*Math.exp(-i*i/(8*s2*s2))*Math.exp(-j*j/6)*(1+0.08*Math.sin(t*3+i+j))+4;
      var k2 = Math.min(1, h/150);
      o.polys.push.apply(o.polys, box(i*26,0,j*26,22,h,22,[(180-70*k2)|0,(150+80*k2)|0,(255-60*k2)|0]));
    }
  } else if(type === 'medical_3d'){
    var pr2 = p.p || 0.2;
    for(var m=0;m<70;m++){

      o.dots.push({p:[95*r*Math.cos(a), 95*y, 95*r*Math.sin(a)], r:8, c: hash(m+3)<pr2 ? '#FF7A8A' : '#8FF0C8'});
    }

      o.dots.push({p:[120*sr*Math.cos(sa), 120*sy, 120*sr*Math.sin(sa)], r: hi?11:6, c: hi?'#FFD166':'#B79CF5'});
    }
    o.txt.push({t:'x̄', p:[0,-140,0]});

    var hA = 90 + 30*Math.sin(t), hB = 115 + 30*Math.cos(t);
    o.polys.push.apply(o.polys, box(-90,0,0,90,hA,50,[120,225,175]));
    o.polys.push.apply(o.polys, box(90,0,0,90,hB,50,[255,150,160]));
    o.txt.push({t:'A',p:[-90,hA+20,0]},{t:'B',p:[90,hB+20,0]});
  } else if(type === 'dice_cards_3d'){
    for(var ci=0;ci<5;ci++){

function draw(c, dt){
  var g = c.getContext('2d'), q = QM[c.dataset.q]; if(!q) return;
  if(c.__run !== false) c.__t = (c.__t || 0) + dt;
  var t = c.__t || 0, W = c.width, H = c.height;
  var sc = scene(q.viz, t, q.vp || {});
  var ry = (c.__ry || 0) + (q.viz === 'dice_3d' ? t*0.8 : Math.sin(t*0.4)*0.5 + 0.4), rx = 0.5;
  var P = function(v){
    var x=v[0], y=v[1], z=v[2], co=Math.cos(ry), si=Math.sin(ry);
    var nx = x*co + z*si, nz = -x*si + z*co; x = nx; z = nz;
    co = Math.cos(rx); si = Math.sin(rx);
    var ny = y*co + z*si; nz = -y*si + z*co; y = ny; z = nz;
    var f = 420 / (420 + z);
    return [W/2 + x*f, H*0.62 - y*f, z, f];
  };
  var items = [];
  sc.polys.forEach(function(f){
    var pp = f.v.map(P);
    items.push({
      z: pp.reduce(function(s,a){ return s+a[2]; }, 0)/4,
      fn: function(){
        g.beginPath();
        pp.forEach(function(a,i){ if(i) g.lineTo(a[0],a[1]); else g.moveTo(a[0],a[1]); });
        g.closePath(); g.fillStyle = f.col; g.fill();
        g.strokeStyle = 'rgba(45,42,74,.6)'; g.stroke();
      }
    });
  });
  sc.dots.forEach(function(d){
    var a = P(d.p);
    items.push({ z:a[2], fn:function(){ g.beginPath(); g.arc(a[0],a[1],Math.max(2,d.r*a[3]),0,7); g.fillStyle=d.c; g.fill(); } });
  });
  sc.txt.forEach(function(d){
    var a = P(d.p);
    items.push({ z:a[2]-1, fn:function(){ g.fillStyle='#FFF1B8'; g.font='900 32px Nunito'; g.textAlign='center'; g.fillText(d.t,a[0],a[1]+10); } });
  });
  g.clearRect(0,0,W,H);
  items.sort(function(a,b){ return b.z - a.z; }).forEach(function(i){ i.fn(); });
  g.fillStyle = '#fff'; g.font = '800 14px Nunito'; g.textAlign = 'left';
  g.fillText('🎲 ' + ((q.vp && q.vp.label) || 'Mô phỏng 3D') + ' · Kéo chuột để xoay góc nhìn', 12, H - 12);
}

    }

    h += '<textarea class="w-full" rows="4" placeholder="Viết bài giải của bạn (có thể dùng $công thức$)..." oninput="U(\''+q.id+'\').essay=this.value">' + esc(u.essay || '') + '</textarea>' +

      '<button class="bt text-sm" onclick="U(\''+q.id+'\').hint=1;updQ(\''+q.id+'\',\''+mode+'\')">💡 Gợi ý nhẹ</button>' +

async function grade(id){
  var q = QM[id], u = U(id);

async function send(id){
  var q = QM[id], u = U(id), inp = $('#in_'+id), v = inp.value.trim(); if(!v) return;

    var hist = u.msgs.slice(0,-1).map(function(m){ return {role: m.r==='u'?'user':'model', parts:[{text:m.t}]}; }).filter(function(m,i){ return !(i===0 && m.role==='model'); });
    rep = (await ai(hist, 'Bạn là Cú Đêm, trợ giảng XSTK Gen Z. Đặt câu hỏi gợi mở Socratic, giải thích dễ hiểu. Đề: '+q.q+'\nLời giải: '+q.sol)).replace(/\n/g,'<br>');
  }catch(e){
    rep = (e.message === 'nokey') ? ('Gợi ý nhanh: ' + q.hint + '<br>Lời giải: ' + q.sol + '<br><i>(Nhập Gemini API Key ở trên để hỏi đáp tự do nhé!)</i>') : ('Lỗi: ' + esc(e.message));
  }
  u.msgs[u.msgs.length-1] = {r:'m', t:rep};

  tx();
}

function snap(){ var c = $('#ipad'); if(!c) return; var g = c.getContext('2d'); PSTK.push(g.getImageData(0,0,c.width,c.height)); if(PSTK.length>20) PSTK.shift(); }
function initPad(){
  var c = $('#ipad'); if(!c) return; var g = c.getContext('2d'); PSTK = []; down = false;
  var pos = function(e){ var r = c.getBoundingClientRect(); return [(e.clientX-r.left)*c.width/r.width, (e.clientY-r.top)*c.height/r.height]; };
  c.onpointerdown = function(e){ snap(); down = true; c.setPointerCapture(e.pointerId); last = pos(e); g.globalCompositeOperation = PEN.e ? 'destination-out' : 'source-over'; g.strokeStyle = PEN.c; g.lineWidth = PEN.e ? 28 : PEN.w; g.lineCap = 'round'; g.lineJoin = 'round'; };
  c.onpointermove = function(e){ if(!down) return; var p = pos(e); g.beginPath(); g.moveTo(last[0],last[1]); g.lineTo(p[0],p[1]); g.stroke(); last = p; };
  c.onpointerup = c.onpointercancel = function(){ down = false; PADIMG = c.toDataURL('image/png'); };
}
function undoPad(){ var c = $('#ipad'); if(c && PSTK.length) c.getContext('2d').putImageData(PSTK.pop(),0,0); }

async function sendFriendReq(toUid, toName){
  if(!currentUser || !myUid()) return openAuthModal('login');
  if(!toUid || toUid === myUid()) return;
  if(MY_FRIENDS[toUid]) return toast('Hai bạn đã là bạn bè của nhau rồi! 🤝');

  var reqObj = {
    fromUid: myUid(),
    fromName: myName(),
    fromEmail: currentUser.email || '',
    fromAv: myAvatar(),
    t: Date.now()
  };
  OUTGOING_REQS[toUid] = true;
  await fbFetch('friend_reqs/' + toUid + '/' + myUid(), 'PUT', reqObj);
  await fbFetch('sent_reqs/' + myUid() + '/' + toUid, 'PUT', true);
  toast('📨 Đã gửi lời mời kết bạn tới ' + (toName || 'bạn học') + '! Chờ bạn ấy đồng ý nhé.');
  if(ST.view === 'forum') render();
}

/* Đồng ý lời mời kết bạn -> Cả 2 chính thức thành Bạn bè và mở khóa Nhắn tin riêng */
async function acceptFriendReq(fromUid, fromName){
  if(!currentUser || !myUid()) return;
  var me = myUid();
  MY_FRIENDS[fromUid] = true;
  delete INCOMING_REQS[fromUid];

  await fbFetch('friends/' + me + '/' + fromUid, 'PUT', true);
  await fbFetch('friends/' + fromUid + '/' + me, 'PUT', true);
  await fbFetch('friend_reqs/' + me + '/' + fromUid, 'DELETE');
  await fbFetch('sent_reqs/' + fromUid + '/' + me, 'DELETE');

  renderAuth();
  toast('🤝 Đã đồng ý kết bạn với ' + (fromName || 'bạn học') + '! Bây giờ hai bạn có thể nhắn tin riêng.');
  if(ST.view === 'forum') render();
}

/* Từ chối lời mời kết bạn */
async function declineFriendReq(fromUid){
  if(!currentUser || !myUid()) return;
  var me = myUid();
  delete INCOMING_REQS[fromUid];
  await fbFetch('friend_reqs/' + me + '/' + fromUid, 'DELETE');
  await fbFetch('sent_reqs/' + fromUid + '/' + me, 'DELETE');
  renderAuth();
  toast('Đã từ chối lời mời kết bạn.');
  if(ST.view === 'forum') render();
}

/* Trò chuyện riêng tư 1-1 giữa 2 người đã là Bạn bè */
function getPairId(uid1, uid2){
  return [String(uid1), String(uid2)].sort().join('__');
}
async function openDM(friendUid){
  if(!currentUser || !myUid()) return openAuthModal('login');
  if(!MY_FRIENDS[friendUid]) return toast('⚠️ Hai bạn cần kết bạn và được đồng ý trước khi nhắn tin riêng tư!');
  ST.activeChatUid = friendUid;
  await loadDMMessages(friendUid);
  if(ST.view !== 'forum') go('forum'); else render();
}
async function loadDMMessages(friendUid){
  if(!currentUser || !friendUid) return;
  var pairId = getPairId(myUid(), friendUid);
  var msgs = await fbFetch('dms/' + pairId);
  DM_MSGS = (msgs && typeof msgs === 'object') ? msgs : {};
}
async function sendDM(){
  if(!currentUser || !ST.activeChatUid) return;
  var fUid = ST.activeChatUid;
  if(!MY_FRIENDS[fUid]) return toast('Chỉ có thể nhắn tin riêng với bạn bè đã kết nối!');
  var inp = $('#dmInput');
  var txt = (inp ? inp.value : ST.dmDraft).trim();
  if(!txt) return;

  var pairId = getPairId(myUid(), fUid);
  var msgId = 'm' + Date.now().toString(36) + Math.random().toString(36).slice(2,5);
  var msgObj = {
    id: msgId,
    senderUid: myUid(),
    senderName: myName(),
    text: txt,
    t: Date.now()
  };
  ST.dmDraft = '';
  if(inp) inp.value = '';
  DM_MSGS[msgId] = msgObj;
  await fbFetch('dms/' + pairId + '/' + msgId, 'PUT', msgObj);
  if(ST.view === 'forum') render();
  var boxEl = $('#dmBox'); if(boxEl) boxEl.scrollTop = boxEl.scrollHeight;
}

/* Đăng bài, thả cảm xúc và bình luận trên Diễn đàn (100% người thật) */
async function pubPost(){
  if(!currentUser || !myUid()){
    toast('🔐 Vui lòng Đăng nhập hoặc Tạo tài khoản để đăng bài!');
    return openAuthModal('login');
  }
  var body = ST.fdraft.trim(), title = ST.ftitle.trim() || 'Thảo luận Xác suất & Thống kê';
  if(!body) return toast('Bạn hãy viết nội dung trước khi đăng nhé ✍️');
  var ch = Number($('#fch') ? $('#fch').value : 1) || 1;
  var img = ($('#fdraw') && $('#fdraw').checked && PADIMG) ? PADIMG : '';
  var id = 'p' + Date.now().toString(36) + myUid().slice(-4);
  var p = {
    id: id, title: title, ch: ch, body: body, img: img,
    an: myName(), au: myUid(), aa: myAvatar(),
    t: Date.now(), likes: {}, comments: {}
  };
  POSTS[id] = p; ST.fdraft = ''; ST.ftitle = '';
  ls.set('forum_real', POSTS);
  await fbFetch('posts_real/' + id, 'PUT', p);
  toast('🎉 Đã đăng bài viết lên Diễn đàn!');
  if(ST.view === 'forum') render();
}

async function react(pid, kind){
  if(!currentUser || !myUid()){
    toast('🔐 Vui lòng đăng nhập để thả cảm xúc!');
    return openAuthModal('login');
  }
  var x = POSTS[pid]; if(!x) return;
  x.likes = x.likes || {};
  var uid = myUid(), nv = (x.likes[uid] === kind) ? null : kind;
  if(nv) x.likes[uid] = nv; else delete x.likes[uid];
  ls.set('forum_real', POSTS);
  await fbFetch('posts_real/' + pid + '/likes/' + uid, 'PUT', nv);
  if(ST.view === 'forum') render();
}

async function comment(pid, txt){
  if(!currentUser || !myUid()){
    toast('🔐 Vui lòng đăng nhập để bình luận!');
    return openAuthModal('login');
  }
  txt = (txt || '').trim(); if(!txt || !POSTS[pid]) return;
  var cid = 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2,5);
  var c = { id:cid, body:txt, an:myName(), au:myUid(), aa:myAvatar(), t:Date.now() };
  POSTS[pid].comments = POSTS[pid].comments || {};
  POSTS[pid].comments[cid] = c;
  ls.set('forum_real', POSTS);
  await fbFetch('posts_real/' + pid + '/comments/' + cid, 'PUT', c);
  if(ST.view === 'forum') render();
}
function cmt(pid){ var v = ST.cd[pid] || ''; ST.cd[pid] = ''; comment(pid, v); }

/* Đồng bộ thời gian thực Bài viết, Lời mời kết bạn, Bạn bè & Tin nhắn riêng từ Firebase */
async function syncFB(){
  var d = await fbFetch('posts_real');
  var chg = false;
  if(d && typeof d === 'object'){
    var newPosts = {};
    for(var id in d){
      var rPost = d[id];
      if(!rPost || !rPost.id || rPost.au === 'owl') continue;
      newPosts[id] = Object.assign({}, rPost, {likes: rPost.likes||{}, comments: rPost.comments||{}});
    }
    if(JSON.stringify(newPosts) !== JSON.stringify(POSTS)){
      POSTS = newPosts;
      ls.set('forum_real', POSTS);
      chg = true;
    }
  }

  if(currentUser && myUid()){
    var me = myUid();
    await fbFetch('users/' + me, 'PUT', { uid:me, name:myName(), email:currentUser.email||'', av:myAvatar(), seen:Date.now() });

    var fr = await fbFetch('friends/' + me);
    var newFriends = (fr && typeof fr === 'object') ? fr : {};
    if(JSON.stringify(newFriends) !== JSON.stringify(MY_FRIENDS)){ MY_FRIENDS = newFriends; chg = true; }

    var inReqs = await fbFetch('friend_reqs/' + me);
    var newIn = (inReqs && typeof inReqs === 'object') ? inReqs : {};
    if(JSON.stringify(newIn) !== JSON.stringify(INCOMING_REQS)){ INCOMING_REQS = newIn; renderAuth(); chg = true; }

    var outReqs = await fbFetch('sent_reqs/' + me);
    OUTGOING_REQS = (outReqs && typeof outReqs === 'object') ? outReqs : {};

    if(ST.activeChatUid && MY_FRIENDS[ST.activeChatUid]){
      var pairId = getPairId(me, ST.activeChatUid);
      var dmData = await fbFetch('dms/' + pairId);
      var newDM = (dmData && typeof dmData === 'object') ? dmData : {};
      if(Object.keys(newDM).length !== Object.keys(DM_MSGS).length){
        DM_MSGS = newDM; chg = true;
      }
    }
  }

  var u = await fbFetch('users');
  if(u && typeof u === 'object'){
    if(Object.keys(u).length !== Object.keys(USERS).length) chg = true;
    USERS = u;
  }

  if(chg && ST.view === 'forum'){
    var act = document.activeElement;
    if(!act || (act.tagName !== 'INPUT' && act.tagName !== 'TEXTAREA')) render();
  }
}
function startSync(){ clearInterval(fbPoll); syncFB(); fbPoll = setInterval(syncFB, 4000); }

function avHTML(av, cls){
  cls = cls || 'w-8 h-8';
  return (av && String(av).indexOf('http') === 0)
    ? '<img src="'+attr(av)+'" class="'+cls+' rounded-full border-2 border-[#2D2A4A] inline-block">'
    : '<span class="text-2xl">'+(av || '🦊')+'</span>';
}

/* Nút trạng thái quan hệ bạn bè trên từng người dùng / bài đăng */
function relationBtnHTML(targetUid, targetName){
  if(!targetUid || targetUid === myUid()) return '<span class="tag bg-[#FFF1B8]">Bạn</span>';
  if(MY_FRIENDS[targetUid]){
    return '<span class="tag bg-[#BFF1DC]">🤝 Bạn bè</span> ' +
           '<button class="bt text-xs bg-[#D9C9FF] ml-1" onclick="openDM(\''+targetUid+'\')">💬 Nhắn tin</button>';
  }
  if(INCOMING_REQS[targetUid]){
    return '<button class="bt text-xs bg-[#BFF1DC]" onclick="acceptFriendReq(\''+targetUid+'\',\''+attr(targetName)+'\')">✅ Đồng ý KB</button>';
  }
  if(OUTGOING_REQS[targetUid]){
    return '<span class="tag bg-gray-100">⏳ Đã gửi lời mời</span>';
  }
  return '<button class="bt text-xs bg-white" onclick="sendFriendReq(\''+targetUid+'\',\''+attr(targetName)+'\')">➕ Kết bạn</button>';
}
